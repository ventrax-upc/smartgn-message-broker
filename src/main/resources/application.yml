server:
  port: 8086

spring:
  application:
    name: smartgn-message-broker
  boot:
    admin:
      client:
        url: http://localhost:8085

mqtt:
  broker:
    protocol: MQTT 5.0 over TLS 1.3
    host: localhost
    port: 1883
    tls-port: 8883
    default-qos: 1

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always

springdoc:
  swagger-ui:
    path: /swagger-ui.html