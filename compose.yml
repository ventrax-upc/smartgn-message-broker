name: smartgn-message-broker
services:
  message-broker:
    build: .
    ports: ["127.0.0.1:8087:8087"]
    environment:
      SERVER_PORT: 8087
      SMARTGN_ADMIN_URL: ${SMARTGN_ADMIN_URL:-http://localhost:8089}
      SMARTGN_ADMIN_USERNAME: ${SMARTGN_ADMIN_USERNAME:-admin}
      SMARTGN_ADMIN_PASSWORD: ${SMARTGN_ADMIN_PASSWORD:-local-admin-password}
      SMARTGN_ADMIN_SERVICE_URL: ${SMARTGN_ADMIN_SERVICE_URL:-http://message-broker:8087}
      SMARTGN_ADMIN_MANAGEMENT_URL: ${SMARTGN_ADMIN_MANAGEMENT_URL:-http://message-broker:8087/actuator}
      SMARTGN_ADMIN_HEALTH_URL: ${SMARTGN_ADMIN_HEALTH_URL:-http://message-broker:8087/actuator/health}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-}
      MQTT_BROKER_HOST: ${MQTT_BROKER_HOST:-localhost}
      MQTT_BROKER_PORT: ${MQTT_BROKER_PORT:-1883}
      MQTT_USERNAME: ${MQTT_USERNAME:-broker-service}
      MQTT_BROKER_PASSWORD: ${MQTT_BROKER_PASSWORD:-}
      MQTT_TOPIC_PREFIX: ${MQTT_TOPIC_PREFIX:-smartgn/events/broker/}
      EMQX_API_URL: ${EMQX_API_URL:-http://localhost:18083/api/v5}
      EMQX_API_KEY: ${EMQX_API_KEY:-}
      EMQX_API_SECRET: ${EMQX_API_SECRET:-}
    mem_limit: 320m
    init: true
